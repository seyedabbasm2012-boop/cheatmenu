name: Build mod
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q cheatmenu-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        working-directory: cheatmenu
        run: |
          set +e
          gradle build > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -vE '^\s+at ' ../build.log | grep -E 'error|What went wrong|Could not|Caused by|^> |not found|cannot find|does not exist|Unsupported|incompatible' | head -c 1800 | tr '\n' '|')
            echo "::error title=BuildError::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: cheatmenu-jar
          path: cheatmenu/build/libs/*.jar
